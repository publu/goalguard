<!doctype html>
<!-- Source for the GitHub social preview. Render with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
       --headless=new --hide-scrollbars --force-device-scale-factor=2 \
       --window-size=1280,640 --screenshot=social-preview.png \
       "file://$PWD/social-card.html"
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 640px; }
      body {
        background: #0b0e14;
        background-image: radial-gradient(120% 120% at 80% 0%, #161b26 0%, #0b0e14 60%);
        font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        overflow: hidden;
        position: relative;
      }
      .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: #f0c000; }
      .left {
        flex: 1;
        padding: 0 0 0 96px;
      }
      .title {
        font-size: 132px;
        font-weight: 800;
        letter-spacing: -3px;
        color: #ffffff;
        line-height: 1;
      }
      .title .keeper { color: #f0c000; }
      .tag {
        margin-top: 28px;
        font-size: 33px;
        font-style: italic;
        color: #9aa4b2;
        line-height: 1.42;
      }
      .code {
        margin-top: 40px;
        font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 26px;
        color: #3fb950;
      }
      .code .dim { color: #6e7681; }
      .right {
        width: 520px;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .right img { width: 470px; height: 470px; object-fit: contain; }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <div class="left">
      <div class="title">goal<span class="keeper">keeper</span></div>
      <div class="tag">You say you're done.<br />She checks the list.<br />You're not done.</div>
      <div class="code"><span class="dim">//</span> goalkeeper: stop blocked, 3 goals open</div>
    </div>
    <div class="right">
      <img src="./goalkeeper.png" alt="goalkeeper" />
    </div>
  </body>
</html>
